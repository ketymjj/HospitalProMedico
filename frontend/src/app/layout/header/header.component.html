<header class="topbar">
  <button mat-icon-button class="menu-toggle" (click)="toggleSidebar.emit()" aria-label="Alternar menu">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="topbar-title">
    <span class="hide-mobile">Sistema de Gestão Hospitalar</span>
  </div>

  <div class="hpm-spacer"></div>

  <div class="topbar-actions">
    <button mat-icon-button [matMenuTriggerFor]="notifMenu" aria-label="Notificações">
      <mat-icon [matBadge]="unreadCount > 0 ? unreadCount : null" matBadgeColor="warn" matBadgeSize="small">
        notifications
      </mat-icon>
    </button>
    <mat-menu #notifMenu="matMenu" class="notif-menu">
      <div class="notif-header" (click)="$event.stopPropagation()">
        <strong>Notificações</strong>
        <button mat-button *ngIf="unreadCount > 0" (click)="markAllAsRead()">Marcar todas como lidas</button>
      </div>
      <div *ngIf="notifications.length === 0" class="notif-empty">Nenhuma notificação</div>
      <button mat-menu-item *ngFor="let notif of notifications" [class.unread]="!notif.read">
        <div class="notif-item">
          <strong>{{ notif.title }}</strong>
          <span>{{ notif.message }}</span>
        </div>
      </button>
    </mat-menu>

    <button mat-button [matMenuTriggerFor]="userMenu" class="user-chip">
      <span class="avatar">{{ initials }}</span>
      <span class="user-info hide-mobile">
        <strong>{{ authService.currentUser()?.name }}</strong>
        <small>{{ roleLabels[authService.currentUser()!.role] }}</small>
      </span>
      <mat-icon class="hide-mobile">expand_more</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item routerLink="/settings">
        <mat-icon>settings</mat-icon>
        <span>Configurações</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</header>
