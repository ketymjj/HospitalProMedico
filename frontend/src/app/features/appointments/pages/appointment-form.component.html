<div class="hpm-page">
  <app-page-header [title]="isEditMode ? 'Editar Consulta' : 'Agendar Consulta'" subtitle="Preencha os dados do agendamento">
    <a mat-stroked-button routerLink="/appointments"><mat-icon>arrow_back</mat-icon> Voltar</a>
  </app-page-header>

  <form [formGroup]="form" (ngSubmit)="submit()" class="hpm-card form-card">
    <div class="form-grid">
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Paciente</mat-label>
        <mat-select formControlName="patientId">
          <mat-option *ngFor="let p of patients()" [value]="p.id">{{ p.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Tipo de consulta</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let t of typeOptions" [value]="t">{{ typeLabels[t] }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Médico</mat-label>
        <mat-select formControlName="doctorId">
          <mat-option *ngFor="let d of doctors()" [value]="d.id">{{ d.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="isEditMode">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let s of statusOptions" [value]="s">{{ statusLabels[s] }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Horário</mat-label>
        <input matInput type="time" formControlName="time" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="span-3">
        <mat-label>Observações</mat-label>
        <textarea matInput formControlName="notes" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="form-actions">
      <a mat-stroked-button routerLink="/appointments">Cancelar</a>
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ isEditMode ? 'Salvar alterações' : 'Agendar consulta' }}
      </button>
    </div>
  </form>
</div>
