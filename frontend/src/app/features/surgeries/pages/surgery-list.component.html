<div class="hpm-page">
  <app-page-header title="Cirurgias" subtitle="Gerencie o centro cirúrgico do hospital">
    <a mat-flat-button color="primary" routerLink="/surgeries/new" *ngIf="canManage">
      <mat-icon>add</mat-icon> Nova Cirurgia
    </a>
  </app-page-header>

  <div class="hpm-card">
    <div class="hpm-filters" style="padding: 16px 16px 0;">
      <mat-form-field appearance="outline" style="width: 260px">
        <mat-label>Pesquisar</mat-label>
        <input matInput placeholder="Paciente, médico ou tipo" [ngModel]="search" (ngModelChange)="onSearchChange($event)" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 200px">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="statusFilter" (selectionChange)="onFilterChange()">
          <mat-option value="">Todos</mat-option>
          <mat-option *ngFor="let s of statusOptions" [value]="s">{{ statusLabels[s] }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-progress-bar mode="indeterminate" *ngIf="loading()"></mat-progress-bar>

    <div class="hpm-table-wrapper" *ngIf="items().length > 0; else emptyState">
      <table mat-table [dataSource]="items()">
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Data</th>
          <td mat-cell *matCellDef="let s">{{ s.date | date: 'dd/MM/yyyy' }} {{ s.time }}</td>
        </ng-container>
        <ng-container matColumnDef="patient">
          <th mat-header-cell *matHeaderCellDef>Paciente</th>
          <td mat-cell *matCellDef="let s">{{ s.patientName }}</td>
        </ng-container>
        <ng-container matColumnDef="doctor">
          <th mat-header-cell *matHeaderCellDef>Médico</th>
          <td mat-cell *matCellDef="let s">{{ s.doctorName }}</td>
        </ng-container>
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let s">{{ s.type }}</td>
        </ng-container>
        <ng-container matColumnDef="room">
          <th mat-header-cell *matHeaderCellDef>Sala</th>
          <td mat-cell *matCellDef="let s">{{ s.room }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let s"><app-status-badge [label]="labelOf(statusLabels, s.status)" [variant]="statusVariant(s.status)"></app-status-badge></td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-col">Ações</th>
          <td mat-cell *matCellDef="let s" class="actions-col">
            <button mat-icon-button [routerLink]="['/surgeries', s.id, 'edit']" matTooltip="Editar" *ngIf="canManage"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" matTooltip="Excluir" *ngIf="isAdmin" (click)="remove(s)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <ng-template #emptyState>
      <app-empty-state *ngIf="!loading()" icon="healing" title="Nenhuma cirurgia encontrada" message="Ajuste os filtros ou agende uma nova cirurgia."></app-empty-state>
    </ng-template>

    <mat-paginator [length]="totalCount()" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50]" [pageIndex]="pageNumber - 1" (page)="onPageChange($event)"></mat-paginator>
  </div>
</div>
