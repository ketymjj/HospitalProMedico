<h2 mat-dialog-title>{{ isEditMode ? 'Editar Usuário' : 'Novo Usuário' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <div class="dialog-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Perfil</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let r of roleOptions" [value]="r">{{ roleLabels[r] }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ isEditMode ? 'Nova senha (opcional)' : 'Senha' }}</mat-label>
        <input matInput formControlName="password" type="password" />
      </mat-form-field>

      <mat-slide-toggle formControlName="isActive" *ngIf="isEditMode">Usuário ativo</mat-slide-toggle>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialogRef.close(false)">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">Salvar</button>
  </mat-dialog-actions>
</form>
