<div class="hpm-page">
  <app-page-header title="Configurações" subtitle="Personalize o sistema conforme as necessidades da instituição"></app-page-header>

  <div class="hpm-card">
    <mat-tab-group>
      <mat-tab label="Dados do Hospital">
        <form [formGroup]="hospitalForm" (ngSubmit)="saveHospital()" class="tab-content form-card">
          <div class="form-grid">
            <mat-form-field appearance="outline" class="span-2">
              <mat-label>Nome do hospital</mat-label>
              <input matInput formControlName="name" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>CNPJ</mat-label>
              <input matInput formControlName="cnpj" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Telefone</mat-label>
              <input matInput formControlName="phone" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="span-2">
              <mat-label>Email</mat-label>
              <input matInput formControlName="email" type="email" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="span-3">
              <mat-label>Endereço</mat-label>
              <input matInput formControlName="address" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="span-3">
              <mat-label>URL do logotipo</mat-label>
              <input matInput formControlName="logoUrl" placeholder="https://..." />
            </mat-form-field>
          </div>

          <div class="form-actions">
            <button mat-flat-button color="primary" type="submit" [disabled]="saving()">Salvar alterações</button>
          </div>
        </form>
      </mat-tab>

      <mat-tab label="Usuários e Permissões">
        <div class="tab-content">
          <div class="users-toolbar">
            <p>Gerencie os usuários e seus perfis de acesso ao sistema.</p>
            <button mat-flat-button color="primary" (click)="openUserDialog(null)">
              <mat-icon>person_add</mat-icon> Novo Usuário
            </button>
          </div>

          <div class="hpm-table-wrapper">
            <table mat-table [dataSource]="users()">
              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Nome</th>
                <td mat-cell *matCellDef="let u">{{ u.name }}</td>
              </ng-container>
              <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let u">{{ u.email }}</td>
              </ng-container>
              <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef>Perfil</th>
                <td mat-cell *matCellDef="let u">{{ labelOf(roleLabels, u.role) }}</td>
              </ng-container>
              <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let u">
                  <app-status-badge [label]="u.isActive ? 'Ativo' : 'Inativo'" [variant]="u.isActive ? 'success' : 'neutral'"></app-status-badge>
                </td>
              </ng-container>
              <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef class="actions-col">Ações</th>
                <td mat-cell *matCellDef="let u" class="actions-col">
                  <button mat-icon-button matTooltip="Editar" (click)="openUserDialog(u)"><mat-icon>edit</mat-icon></button>
                  <button mat-icon-button color="warn" matTooltip="Excluir" [disabled]="u.id === authService.currentUser()?.id" (click)="removeUser(u)"><mat-icon>delete</mat-icon></button>
                </td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
