<div class="hpm-page">
  <app-page-header [title]="isEditMode ? 'Editar Pagamento' : 'Novo Pagamento'" subtitle="Preencha os dados do pagamento">
    <a mat-stroked-button routerLink="/payments"><mat-icon>arrow_back</mat-icon> Voltar</a>
  </app-page-header>

  <form [formGroup]="form" (ngSubmit)="submit()" class="hpm-card form-card">
    <div class="form-grid">
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Paciente</mat-label>
        <mat-select formControlName="patientId">
          <mat-option *ngFor="let p of patients()" [value]="p.id">{{ p.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Forma de pagamento</mat-label>
        <mat-select formControlName="method">
          <mat-option *ngFor="let m of methodOptions" [value]="m">{{ methodLabels[m] }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Descrição</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Valor (R$)</mat-label>
        <input matInput type="number" step="0.01" formControlName="amount" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data de vencimento</mat-label>
        <input matInput [matDatepicker]="duePicker" formControlName="dueDate" appDateMask placeholder="dd/mm/aaaa" maxlength="10" />
        <mat-datepicker-toggle matSuffix [for]="duePicker"></mat-datepicker-toggle>
        <mat-datepicker #duePicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="isEditMode">
        <mat-label>Data de pagamento</mat-label>
        <input matInput [matDatepicker]="payPicker" formControlName="paymentDate" appDateMask placeholder="dd/mm/aaaa" maxlength="10" />
        <mat-datepicker-toggle matSuffix [for]="payPicker"></mat-datepicker-toggle>
        <mat-datepicker #payPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" *ngIf="isEditMode">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option *ngFor="let s of statusOptions" [value]="s">{{ statusLabels[s] }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-actions">
      <a mat-stroked-button routerLink="/payments">Cancelar</a>
      <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
        {{ isEditMode ? 'Salvar alterações' : 'Registrar pagamento' }}
      </button>
    </div>
  </form>
</div>
