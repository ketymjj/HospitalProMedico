<div class="hpm-page">
  <app-page-header title="Médicos" subtitle="Gerencie o corpo clínico do hospital">
    <a mat-flat-button color="primary" routerLink="/doctors/new" *ngIf="isAdmin">
      <mat-icon>add</mat-icon> Novo Médico
    </a>
  </app-page-header>

  <div class="hpm-card">
    <div class="hpm-filters" style="padding: 16px 16px 0;">
      <mat-form-field appearance="outline" style="width: 260px">
        <mat-label>Pesquisar</mat-label>
        <input matInput placeholder="Nome, CRM ou email" [ngModel]="search" (ngModelChange)="onSearchChange($event)" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 220px">
        <mat-label>Especialidade</mat-label>
        <mat-select [(ngModel)]="specialtyFilter" (selectionChange)="onFilterChange()">
          <mat-option value="">Todas</mat-option>
          <mat-option *ngFor="let s of specialtyOptions" [value]="s">{{ specialtyLabels[s] }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 180px">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="statusFilter" (selectionChange)="onFilterChange()">
          <mat-option value="">Todos</mat-option>
          <mat-option *ngFor="let s of statusOptions" [value]="s">{{ statusLabels[s] }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-progress-bar mode="indeterminate" *ngIf="loading()"></mat-progress-bar>

    <div class="hpm-table-wrapper" *ngIf="items().length > 0; else emptyState">
      <table mat-table [dataSource]="items()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let d"><a [routerLink]="['/doctors', d.id]" class="link-strong">{{ d.name }}</a></td>
        </ng-container>
        <ng-container matColumnDef="crm">
          <th mat-header-cell *matHeaderCellDef>CRM</th>
          <td mat-cell *matCellDef="let d">{{ d.crm }}</td>
        </ng-container>
        <ng-container matColumnDef="specialty">
          <th mat-header-cell *matHeaderCellDef>Especialidade</th>
          <td mat-cell *matCellDef="let d">{{ labelOf(specialtyLabels, d.specialty) }}</td>
        </ng-container>
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Telefone</th>
          <td mat-cell *matCellDef="let d">{{ d.phone }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let d">
            <app-status-badge [label]="labelOf(statusLabels, d.status)" [variant]="statusVariant(d.status)"></app-status-badge>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-col">Ações</th>
          <td mat-cell *matCellDef="let d" class="actions-col">
            <button mat-icon-button [routerLink]="['/doctors', d.id]" matTooltip="Ver detalhes"><mat-icon>visibility</mat-icon></button>
            <button mat-icon-button [routerLink]="['/doctors', d.id, 'edit']" matTooltip="Editar" *ngIf="isAdmin"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="remove(d)" matTooltip="Excluir" *ngIf="isAdmin"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <ng-template #emptyState>
      <app-empty-state *ngIf="!loading()" icon="medical_services" title="Nenhum médico encontrado" message="Ajuste os filtros ou cadastre um novo médico."></app-empty-state>
    </ng-template>

    <mat-paginator [length]="totalCount()" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50]" [pageIndex]="pageNumber - 1" (page)="onPageChange($event)"></mat-paginator>
  </div>
</div>
