<div class="hpm-page">
  <app-page-header title="Internações" subtitle="Gerencie as internações do hospital">
    <a mat-flat-button color="primary" routerLink="/hospitalizations/new" *ngIf="canManage">
      <mat-icon>add</mat-icon> Nova Internação
    </a>
  </app-page-header>

  <div class="hpm-card">
    <div class="hpm-filters" style="padding: 16px 16px 0; align-items: center;">
      <mat-form-field appearance="outline" style="width: 260px" *ngIf="!onlyCurrent">
        <mat-label>Pesquisar</mat-label>
        <input matInput placeholder="Paciente ou médico" [ngModel]="search" (ngModelChange)="onSearchChange($event)" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 200px" *ngIf="!onlyCurrent">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="statusFilter" (selectionChange)="onFilterChange()">
          <mat-option value="">Todos</mat-option>
          <mat-option *ngFor="let s of statusOptions" [value]="s">{{ statusLabels[s] }}</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="hpm-spacer"></div>

      <button mat-stroked-button [color]="onlyCurrent ? 'primary' : undefined" (click)="toggleCurrent()">
        <mat-icon>local_hospital</mat-icon> {{ onlyCurrent ? 'Ver todas' : 'Pacientes internados agora' }}
      </button>
    </div>

    <mat-progress-bar mode="indeterminate" *ngIf="loading()"></mat-progress-bar>

    <div class="hpm-table-wrapper" *ngIf="items().length > 0; else emptyState">
      <table mat-table [dataSource]="items()">
        <ng-container matColumnDef="patient">
          <th mat-header-cell *matHeaderCellDef>Paciente</th>
          <td mat-cell *matCellDef="let h">{{ h.patientName }}</td>
        </ng-container>
        <ng-container matColumnDef="doctor">
          <th mat-header-cell *matHeaderCellDef>Médico</th>
          <td mat-cell *matCellDef="let h">{{ h.doctorName }}</td>
        </ng-container>
        <ng-container matColumnDef="admission">
          <th mat-header-cell *matHeaderCellDef>Entrada</th>
          <td mat-cell *matCellDef="let h">{{ h.admissionDate | date: 'dd/MM/yyyy' }}</td>
        </ng-container>
        <ng-container matColumnDef="room">
          <th mat-header-cell *matHeaderCellDef>Quarto/Leito</th>
          <td mat-cell *matCellDef="let h">{{ h.room }}/{{ h.bed }}</td>
        </ng-container>
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Tipo</th>
          <td mat-cell *matCellDef="let h">{{ labelOf(typeLabels, h.type) }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let h"><app-status-badge [label]="labelOf(statusLabels, h.status)" [variant]="statusVariant(h.status)"></app-status-badge></td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-col">Ações</th>
          <td mat-cell *matCellDef="let h" class="actions-col">
            <button mat-icon-button [routerLink]="['/hospitalizations', h.id, 'edit']" matTooltip="Editar" *ngIf="canManage"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" matTooltip="Excluir" *ngIf="isAdmin" (click)="remove(h)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <ng-template #emptyState>
      <app-empty-state *ngIf="!loading()" icon="local_hospital" title="Nenhuma internação encontrada" message="Ajuste os filtros ou registre uma nova internação."></app-empty-state>
    </ng-template>

    <mat-paginator *ngIf="!onlyCurrent" [length]="totalCount()" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50]" [pageIndex]="pageNumber - 1" (page)="onPageChange($event)"></mat-paginator>
  </div>
</div>
