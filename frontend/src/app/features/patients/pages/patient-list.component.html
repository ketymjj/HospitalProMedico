<div class="hpm-page">
  <app-page-header title="Pacientes" subtitle="Gerencie os pacientes cadastrados no sistema">
    <a mat-flat-button color="primary" routerLink="/patients/new" *ngIf="canManage">
      <mat-icon>add</mat-icon> Novo Paciente
    </a>
  </app-page-header>

  <div class="hpm-card">
    <div class="hpm-filters" style="padding: 16px 16px 0;">
      <mat-form-field appearance="outline" style="width: 280px">
        <mat-label>Pesquisar</mat-label>
        <input matInput placeholder="Nome, CPF, email ou telefone" [ngModel]="search" (ngModelChange)="onSearchChange($event)" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 200px">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="statusFilter" (selectionChange)="onStatusChange()">
          <mat-option value="">Todos</mat-option>
          <mat-option *ngFor="let s of statusOptions" [value]="s">{{ statusLabels[s] }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-progress-bar mode="indeterminate" *ngIf="loading()"></mat-progress-bar>

    <div class="hpm-table-wrapper" *ngIf="items().length > 0; else emptyState">
      <table mat-table [dataSource]="items()">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let p">
            <a [routerLink]="['/patients', p.id]" class="link-strong">{{ p.name }}</a>
          </td>
        </ng-container>

        <ng-container matColumnDef="cpf">
          <th mat-header-cell *matHeaderCellDef>CPF</th>
          <td mat-cell *matCellDef="let p">{{ p.cpf }}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Telefone</th>
          <td mat-cell *matCellDef="let p">{{ p.phone }}</td>
        </ng-container>

        <ng-container matColumnDef="healthPlan">
          <th mat-header-cell *matHeaderCellDef>Plano de Saúde</th>
          <td mat-cell *matCellDef="let p">{{ p.healthPlanName || 'Particular' }}</td>
        </ng-container>

        <ng-container matColumnDef="birthDate">
          <th mat-header-cell *matHeaderCellDef>Nascimento</th>
          <td mat-cell *matCellDef="let p">{{ p.birthDate | date: 'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let p">
            <app-status-badge [label]="labelOf(statusLabels, p.status)" [variant]="statusVariant(p.status)"></app-status-badge>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-col">Ações</th>
          <td mat-cell *matCellDef="let p" class="actions-col">
            <button mat-icon-button [routerLink]="['/patients', p.id]" matTooltip="Ver detalhes">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button [routerLink]="['/patients', p.id, 'edit']" matTooltip="Editar" *ngIf="canManage">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="remove(p)" matTooltip="Excluir" *ngIf="canDelete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <ng-template #emptyState>
      <app-empty-state
        *ngIf="!loading()"
        icon="people_outline"
        title="Nenhum paciente encontrado"
        message="Tente ajustar os filtros de busca ou cadastre um novo paciente."
      ></app-empty-state>
    </ng-template>

    <mat-paginator
      [length]="totalCount()"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 25, 50]"
      [pageIndex]="pageNumber - 1"
      (page)="onPageChange($event)"
    ></mat-paginator>
  </div>
</div>
